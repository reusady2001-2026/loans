name: Build Windows desktop app

# Builds the Electron desktop app into a portable Windows .exe on GitHub's own
# Windows machines, then publishes it as a downloadable release. Nothing needs
# to be installed locally — download the .exe from the release and double-click.

on:
  push:
    branches: ["claude/awesome-ptolemy-4s9eez"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build portable Windows .exe
        run: npm run build:win

      - name: Show build output
        shell: bash
        run: ls -la release || true

      # Always keep the .exe as a run artifact (works regardless of repo settings).
      - name: Upload .exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loan-Debt-Service-Hub-Windows
          path: release/*.exe
          if-no-files-found: error

      # Publish this build as its OWN versioned release, taken from package.json.
      # Older versions' releases are never deleted — every version stays available,
      # and GitHub's /releases/latest link auto-points at the newest one. Re-running
      # the same version only refreshes that version's .exe.
      - name: Publish versioned release
        if: github.ref == 'refs/heads/claude/awesome-ptolemy-4s9eez'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="v${VER}"
          NOTES="Portable Windows desktop app (v${VER}). Download the .exe below, double-click it — it runs offline, no install and no admin rights needed. (Windows may show a SmartScreen notice for unsigned apps: click **More info → Run anyway**.)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.exe --clobber
            gh release edit "$TAG" --latest
          else
            gh release create "$TAG" release/*.exe \
              --target "$GITHUB_SHA" \
              --title "Loan Debt Service Hub v${VER} — Windows desktop app" \
              --notes "$NOTES" \
              --latest
          fi
          # One-time correction: v1.2.0 was published for a design-only change that
          # should have been the 1.1.1 patch. Remove that stray release + tag (it is
          # newer than the real latest, not older history). Harmless once it's gone.
          gh release delete v1.2.0 --yes --cleanup-tag || true
